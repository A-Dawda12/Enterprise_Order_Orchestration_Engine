openapi: 3.0.3

info:
  title: Shipping Service API
  description: Create, get, and cancel shipment APIs
  version: 1.0.0

servers:
  - url: http://localhost:8085/shipping
    description: Local

tags:
  - name: Shipping
  - name: Health

paths:
  /v1/health:
    get:
      tags:
        - Health
      summary: Health probe
      operationId: health
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string

  /v1/shipments:
    post:
      tags:
        - Shipping
      summary: Create shipment
      operationId: createShipment
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShipmentRequest"
      responses:
        "201":
          description: Shipment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentResponse"

  /v1/shipments/{shipmentId}:
    get:
      tags:
        - Shipping
      summary: Get shipment
      operationId: getShipment
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shipment found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentResponse"
        "404":
          description: Shipment not found

    delete:
      tags:
        - Shipping
      summary: Cancel shipment
      operationId: cancelShipment
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Cancelled

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string

  schemas:
    CreateShipmentRequest:
      type: object
      required:
        - orderId
        - shippingAddress
        - items
      properties:
        orderId:
          type: string
        reservationId:
          type: string
        shippingAddress:
          $ref: "#/components/schemas/ShippingAddressRequest"
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ShipmentItemRequest"

    ShippingAddressRequest:
      type: object
      required:
        - line1
        - city
        - postalCode
        - country
      properties:
        line1:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        country:
          type: string

    ShipmentItemRequest:
      type: object
      required:
        - sku
        - quantity
      properties:
        sku:
          type: string
        quantity:
          type: integer
          minimum: 1

    ShipmentResponse:
      type: object
      properties:
        shipmentId:
          type: string
        orderId:
          type: string
        status:
          type: string
        carrier:
          type: string
        trackingNumber:
          type: string
        labelUrl:
          type: string
        createdAt:
          type: string
          format: date-time