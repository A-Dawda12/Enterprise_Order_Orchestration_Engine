openapi: 3.0.3
info:
  title: Inventory Service API
  description: Stock lookup and reservation APIs
  version: 1.0.0

servers:
  - url: http://localhost:8082/inventory
    description: Local

tags:
  - name: Inventory
  - name: Health

paths:
  /v1/health:
    get:
      tags: [Health]
      summary: Health probe
      operationId: health
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string

  /v1/inventory/{sku}:
    get:
      tags: [Inventory]
      summary: Get stock for SKU
      operationId: getStock
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stock found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockResponse"
        "404":
          description: SKU not found

  /v1/reservations:
    post:
      tags: [Inventory]
      summary: Reserve inventory
      operationId: reserve
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReserveRequest"
      responses:
        "201":
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResponse"

  /v1/reservations/{reservationId}:
    delete:
      tags: [Inventory]
      summary: Release reservation
      operationId: release
      parameters:
        - name: reservationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Released

  /v1/reservations/{reservationId}/confirm:
    post:
      tags: [Inventory]
      summary: Confirm reservation
      operationId: confirm
      parameters:
        - name: reservationId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResponse"

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string

  schemas:
    ReserveRequest:
      type: object
      required:
        - orderId
        - items
      properties:
        orderId:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ReserveItemRequest"

    ReserveItemRequest:
      type: object
      required:
        - sku
        - quantity
      properties:
        sku:
          type: string
        quantity:
          type: integer
          minimum: 1

    ReservationResponse:
      type: object
      properties:
        reservationId:
          type: string
        orderId:
          type: string
        status:
          type: string
        expiresAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReservationItemResponse"

    ReservationItemResponse:
      type: object
      properties:
        sku:
          type: string
        quantity:
          type: integer
        reserved:
          type: boolean

    StockResponse:
      type: object
      properties:
        sku:
          type: string
        availableQuantity:
          type: integer
        reservedQuantity:
          type: integer