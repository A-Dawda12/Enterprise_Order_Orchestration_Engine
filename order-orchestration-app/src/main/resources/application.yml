spring:
  application:
    name: order-orchestration-app
  profiles:
    active: local

server:
  port: 8090
  servlet:
    context-path: /orchestration

zeebe:
  client:
    broker:
      grpc-address: ${ZEEBE_GRPC_ADDRESS:localhost:26500}
      rest-address: ${ZEEBE_REST_ADDRESS:http://localhost:8080}
    security:
      plaintext: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
